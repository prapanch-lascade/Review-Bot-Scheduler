# Copy this file into an APP repo at .github/workflows/review-sync-trigger.yml
# and set the "project_slug" for that app.
#
# Requirements in the app repo:
#   - Secret CENTRAL_DISPATCH_TOKEN: a PAT / GitHub App token allowed to POST
#     repository_dispatch to the central repo (prapanch-lascade/Review-Bot-Scheduler).
#
# The payload carries only the project slug (no secrets). It identifies the app
# and names its state folder (state/<project_slug>/) in the central repo.

name: Trigger Review Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to central review-bot
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
          repository: prapanch-lascade/Review-Bot-Scheduler   # <- central repo (owner/name)
          event-type: review-sync
          client-payload: >-
            { "project_slug": "airlines70" }
