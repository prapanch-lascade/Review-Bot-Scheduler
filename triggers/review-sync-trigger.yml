# Copy this file into an APP repo at .github/workflows/review-sync-trigger.yml
# and edit the client-payload values for that app.
#
# Requirements in the app repo:
#   - Secret CENTRAL_DISPATCH_TOKEN: a PAT / GitHub App token allowed to POST
#     repository_dispatch to the central review-bot repo.
#
# The payload carries only non-secret identifiers. The bot's real secrets are
# read by the central workflow from the app's Infisical project (/reviews).

name: Trigger Review Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to central review-bot
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
          repository: Lascade-Co/review-bot            # <- central repo (owner/name)
          event-type: review-sync
          client-payload: >-
            {
              "app": "airlines70",
              "project_slug": "the-infisical-project-slug",
              "env_slug": "prod"
            }
